<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>二溪國小 財產盤點</title>
<style>
  body{font-family:-apple-system,sans-serif;margin:0;padding:12px;background:#f4f4f6}
  .box{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px}
  input,select,button{font-size:17px;padding:10px;width:100%;box-sizing:border-box;margin:4px 0}
  button{border:0;border-radius:10px;background:#0a84ff;color:#fff}
  button:disabled{opacity:.5}
  button.gray{background:#8e8e93}
  .warn{color:#c00;font-weight:bold}
  .ok{color:#188038;font-weight:bold}
  td{padding:3px 6px;vertical-align:top} td:first-child{color:#666;white-space:nowrap}
  #reader{width:100%}
  .bar{height:8px;background:#e5e5ea;border-radius:4px;overflow:hidden;margin:6px 0}
  .bar>div{height:100%;background:#34c759}
  .row{display:block;width:100%;text-align:left;background:#f2f2f7;color:#000;margin:6px 0;padding:10px}
  .row.done{opacity:.55}
  .row small{color:#555}
  label.chk{display:flex;align-items:center;gap:8px;font-size:15px}
  label.chk input{width:auto;margin:0}
  #locInfo{font-size:15px;color:#333;margin:4px 0}
</style>
</head>
<body>

<!-- 1. 姓名與通關碼 -->
<!-- 同步狀態（有尚未送出的盤點時才顯示） -->
<div class="box" id="syncBar" style="display:none"></div>

<div class="box">
  <input id="who" placeholder="盤點人姓名（例如：黃彥然）">
  <input id="token" placeholder="通關碼" type="password">
</div>

<!-- 2. 掃描區（在清單上面） -->
<div class="box">
  <div id="reader"></div>
  <button id="start">開始掃描</button>
  <label>相機無法使用時，改用拍照辨識：
    <input type="file" id="file" accept="image/*" capture="environment"></label>
  <input id="manual" placeholder="或手動輸入登錄號（例如 3000111）">
  <button class="gray" id="manualGo">查詢</button>
</div>

<!-- 3. 確認卡片與訊息 -->
<div class="box" id="card" style="display:none"></div>
<div id="msg" class="box" style="display:none"></div>

<!-- 4. 盤點清單 -->
<div class="box" id="mine" style="display:none">
  <div id="mineSummary"></div>
  <div class="bar"><div id="mineBar" style="width:0"></div></div>
  <select id="loc"></select>
  <div id="locInfo"></div>
  <label class="chk"><input type="checkbox" id="showDone">顯示已盤點</label>
  <div id="mineList"></div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxtdsSc31OX5Yx7cXj17WGbpvD4thaJFqDKVRmyGbg4XA9nDyA-UhoL7cT73b25pcz6/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scanner = null, current = null, busy = false;
let mine = null, mineSeq = 0, mineTimer = null;
let selLoc = '';

['who','token'].forEach(k => {
  $(k).value = localStorage.getItem(k) || '';
  $(k).addEventListener('change', () => {
    localStorage.setItem(k, $(k).value.trim());
    if (k === 'who') selLoc = '';
    loadMine();
  });
  $(k).addEventListener('input', () => {
    clearTimeout(mineTimer);
    mineTimer = setTimeout(() => {
      localStorage.setItem(k, $(k).value.trim());
      if (k === 'who') selLoc = '';
      loadMine();
    }, 800);
  });
});
$('showDone').onchange = () => renderMine();
$('loc').onchange = () => { selLoc = $('loc').value; renderMine(); };

async function call(payload) {
  const r = await fetch(API, { method: 'POST',
    body: JSON.stringify({ ...payload, token: $('token').value.trim() }) });
  return r.json();
}

function say(t, cls) {
  const m = $('msg'); m.style.display = 'block';
  m.innerHTML = `<span class="${cls||''}">${t}</span>`;
}

/* ---------- 我的財產清單 ---------- */
async function loadMine(silent) {
  const who = $('who').value.trim(), token = $('token').value.trim();
  if (!who || !token) { $('mine').style.display = 'none'; return; }
  const seq = ++mineSeq;
  $('mine').style.display = 'block';
  if (!silent) $('mineSummary').textContent = '載入清單中…';
  let res;
  try { res = await call({ action: 'list', who }); }
  catch (e) {
    if (seq === mineSeq && !silent) $('mineSummary').innerHTML = '<span class="warn">連線失敗，請確認網路</span>';
    return;
  }
  if (seq !== mineSeq) return;
  if (!res.ok) {
    $('mineSummary').innerHTML = `<span class="warn">${esc(res.msg)}</span>`;
    $('mineList').innerHTML = ''; return;
  }
  mine = res; mine.who = who;
  applyPending();
  renderMine();
}

function renderLocOptions() {
  const stat = new Map();
  mine.items.forEach(it => {
    const k = it.存放地點 || '（未填）';
    const s = stat.get(k) || { rem: 0, tot: 0 };
    s.tot++;
    if (it.盤點狀態 !== '已盤點') s.rem++;
    stat.set(k, s);
  });
  if (selLoc && !stat.has(selLoc)) selLoc = '';
  let html = `<option value="">全部地點（剩 ${mine.remaining}/${mine.total}）</option>`;
  stat.forEach((s, k) => {
    html += `<option value="${esc(k)}"${k === selLoc ? ' selected' : ''}>${esc(k)}（剩 ${s.rem}/${s.tot}）</option>`;
  });
  $('loc').innerHTML = html;
  $('loc').value = selLoc;
  return stat;
}

function renderMine() {
  if (!mine) return;
  if (mine.total === 0) {
    $('mineSummary').innerHTML = '<span class="warn">清冊中找不到此保管人，請確認姓名</span>';
    $('mineBar').style.width = '0'; $('mineList').innerHTML = '';
    $('loc').innerHTML = ''; $('locInfo').textContent = ''; return;
  }
  const pct = Math.round(mine.done / mine.total * 100);
  $('mineSummary').innerHTML = mine.remaining === 0
    ? `<span class="ok">🎉 全部盤點完成（共 ${mine.total} 件）</span>`
    : `剩餘 <b style="font-size:22px">${mine.remaining}</b> 件未盤點（共 ${mine.total} 件，已完成 ${mine.done} 件）`;
  $('mineBar').style.width = pct + '%';

  const stat = renderLocOptions();
  if (selLoc) {
    const s = stat.get(selLoc);
    $('locInfo').innerHTML = s.rem === 0
      ? `📍${esc(selLoc)}：<span class="ok">已全部盤點完成 ✔</span>`
      : `📍${esc(selLoc)}：此地點剩餘 <b>${s.rem}</b> 件（共 ${s.tot} 件）`;
  } else {
    $('locInfo').textContent = '';
  }

  const showDone = $('showDone').checked;
  const html = mine.items.map((it, i) => ({ it, i }))
    .filter(x => !selLoc || (x.it.存放地點 || '（未填）') === selLoc)
    .filter(x => showDone || x.it.盤點狀態 !== '已盤點')
    .map(({ it, i }) => `
      <button class="row ${it.盤點狀態 === '已盤點' ? 'done' : ''}" data-i="${i}">
        <b>${esc(it.登錄號)}</b>｜${esc(it.財產名稱)}${it.盤點狀態 === '已盤點' ? ' ✔' : ''}<br>
        <small>${esc(it.型式)}<br>📍${esc(it.存放地點)}</small>
      </button>`).join('');
  $('mineList').innerHTML = html || '<p class="ok">沒有未盤點的品項</p>';
  $('mineList').querySelectorAll('button[data-i]').forEach(b =>
    b.onclick = () => openFromList(+b.dataset.i));
}

async function openFromList(i) {
  pauseScan();
  const it = mine.items[i];
  current = { code: it.登錄號, items: [it], item: it, fromList: true };
  $('msg').style.display = 'none';
  showCard(it);
  $('card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- 掃描 ---------- */
function getScanner() {
  if (!scanner) scanner = new Html5Qrcode('reader', {
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],            // 只辨識 QR，不辨識其他條碼
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },      // 有手機內建偵測器就用它
    verbose: false
  });
  return scanner;
}
const scanState = () => (scanner ? scanner.getState() : 1);   // 1 未啟動、2 掃描中、3 暫停

async function startScan() {
  const s = getScanner();
  if (scanState() === 3) { try { s.resume(); return; } catch (e) {} }   // 暫停中：直接繼續，不重開相機
  if (scanState() === 2) return;
  const cfg = {
    fps: 20, disableFlip: true,
    qrbox: (w, h) => { const m = Math.floor(Math.min(w, h) * 0.8); return { width: m, height: m }; },
    videoConstraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
  };
  try {
    await s.start({ facingMode: 'environment' }, cfg, onCode, () => {});
  } catch (e) {
    try {                                    // 高解析度失敗就退回預設設定
      delete cfg.videoConstraints;
      await s.start({ facingMode: 'environment' }, cfg, onCode, () => {});
    } catch (e2) { say('相機無法啟動，請改用下方拍照辨識或手動輸入', 'warn'); return; }
  }
  tuneFocus();
}

function tuneFocus() {                        // 支援的手機才會生效（多數 Android）
  try {
    const v = document.querySelector('#reader video');
    const t = v && v.srcObject && v.srcObject.getVideoTracks()[0];
    const caps = t && t.getCapabilities ? t.getCapabilities() : {};
    if (t && caps.focusMode && caps.focusMode.includes('continuous'))
      t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
  } catch (e) {}
}
function pauseScan() { try { if (scanState() === 2) scanner.pause(true); } catch (e) {} }
async function stopScan() { try { if (scanState() !== 1) await scanner.stop(); } catch (e) {} }

async function onCode(text) {
  if (busy) return;
  busy = true;
  if (navigator.vibrate) navigator.vibrate(60);
  pauseScan();                                // 凍結畫面但不關相機，下一件可立即繼續
  try { await lookup(text); } finally { busy = false; }
}

// 從 QR 網址取出登錄號（與後端規則相同）
function regFromCode(raw) {
  const s = String(raw || '').trim();
  const m = s.match(/[?&]id=([^&]+)/);
  const id = m ? decodeURIComponent(m[1]) : s;
  const parts = id.split('_');
  return parts[parts.length - 1].trim();
}

async function lookup(code) {
  const who = $('who').value.trim();
  if (!who) { say('請先輸入盤點人姓名', 'warn'); return; }
  const reg = regFromCode(code);

  // 快速路徑：品項在自己的清單內、且登錄號不會撞號 → 直接用本機資料，不用連線
  if (mine && mine.who === who && !(mine.dup || []).includes(reg)) {
    const it = mine.items.find(x => String(x.登錄號) === reg);
    if (it) {
      current = { code: reg, items: [it], item: it };
      $('msg').style.display = 'none';
      showCard(it);
      return;
    }
  }

  say('查詢中…');
  let res;
  try { res = await call({ action: 'lookup', code, who }); }
  catch (e) { say('連線失敗，請確認網路後重試', 'warn'); return; }
  if (!res.ok) { say(esc(res.msg), 'warn'); $('card').style.display = 'none'; return; }
  current = { code, items: res.items, item: null };
  $('msg').style.display = 'none';
  if (res.items.length === 1) pick(0); else showChoices(res.items);
}

function pick(i) {
  current.item = current.items[i];
  showCard(current.item);
}

function showChoices(items) {
  const btns = items.map((it, i) => `
    <button class="gray" data-i="${i}" style="text-align:left">
      <b>${esc(it.物品編號)}</b>｜${esc(it.財產名稱)}${it.盤點狀態 === '已盤點' ? '（已盤點）' : ''}<br>
      <small>${esc(it.型式)} ／ ${esc(it.存放地點)} ／ ${esc(it.保管人)}</small>
    </button>`).join('');
  $('card').style.display = 'block';
  $('card').innerHTML =
    `<p class="warn">此登錄號對應 ${items.length} 個品項，請對照標籤上的「物品編號」選擇：</p>
     ${btns}<button id="cancel">取消，重新掃描</button>`;
  $('card').querySelectorAll('button[data-i]').forEach(b => b.onclick = () => pick(+b.dataset.i));
  $('cancel').onclick = reset;
}

function showCard(it) {
  const rows = ['物品編號','財產名稱','型式','存放地點','保管人','領用單位','購置日期']
    .map(k => `<tr><td>${k}</td><td>${esc(it[k])}</td></tr>`).join('');
  const done = it.盤點狀態 === '已盤點'
    ? `<p class="ok">此品項已於 ${esc(it.盤點時間)} 由 ${esc(it.盤點人)} 盤點</p>` : '';
  const mineWarn = it.notMine
    ? `<p class="warn">注意：此品項保管人為 ${esc(it.保管人)}，非您本人</p>` : '';
  $('card').style.display = 'block';
  $('card').innerHTML = `<table>${rows}</table>${done}${mineWarn}
    <select id="cond"><option>正常</option><option>損壞</option><option>待報廢</option><option>地點不符</option><option>保管人不符</option><option>無標籤</option></select>
    <input id="note" placeholder="備註（選填）">
    <button id="ok">確認盤點</button>
    <button class="gray" id="cancel">取消</button>`;
  $('ok').onclick = confirmIt;
  $('cancel').onclick = reset;
}

/* ---------- 盤點佇列：先寫本機、背景送出 ---------- */
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } };
let queue = lsGet('invQueue'), failed = lsGet('invFailed');
let flushing = false, retryTimer = null;
const saveQ = () => {
  localStorage.setItem('invQueue', JSON.stringify(queue));
  localStorage.setItem('invFailed', JSON.stringify(failed));
  renderSync();
};
const nowStr = () => {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${z(d.getMonth() + 1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
};

function markDone(it, who, time) {
  if (!mine) return;
  const t = mine.items.find(x => x.登錄號 === it.登錄號 && x.物品編號 === it.物品編號);
  if (!t) return;
  if (t.盤點狀態 !== '已盤點') { mine.done++; mine.remaining--; }
  t.盤點狀態 = '已盤點'; t.盤點時間 = time; t.盤點人 = who;
}
function applyPending() {                      // 伺服器清單尚未包含的盤點，套回畫面
  if (!mine) return;
  queue.forEach(j => markDone({ 登錄號: j.regNo, 物品編號: j.itemNo }, j.who, j.time));
  renderMine();
}

function renderSync() {
  const el = $('syncBar');
  if (!queue.length && !failed.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  let h = '';
  if (queue.length) h += `<div>⏳ 有 <b>${queue.length}</b> 筆盤點正在同步到試算表…<br><small>請先不要關閉網頁；斷線時會自動重試</small></div>`;
  if (failed.length) {
    h += `<div class="warn">⚠ ${failed.length} 筆同步失敗：${esc(failed[0].err)}`
      + (failed.length > 1 ? ' 等' : '') + `<br><small>${failed.map(j => esc(j.name)).join('、')}</small></div>`
      + `<button id="retryBtn">重新送出失敗的項目</button>`;
  }
  el.innerHTML = h;
  const rb = $('retryBtn');
  if (rb) rb.onclick = () => { queue.push(...failed.map(({ err, ...j }) => j)); failed = []; saveQ(); flush(); };
}

async function flush() {
  if (flushing) return;
  flushing = true; clearTimeout(retryTimer);
  try {
    while (queue.length) {
      const j = queue[0];
      let res;
      try {
        res = await call({ action: 'confirm', code: j.regNo, itemNo: j.itemNo,
          who: j.who, condition: j.cond, note: j.note });
      } catch (e) {                            // 網路問題：保留佇列，稍後重試
        retryTimer = setTimeout(flush, 5000);
        return;
      }
      queue.shift();
      if (!res.ok) failed.push({ ...j, err: res.msg || '未知錯誤' });
      saveQ();
    }
    if (mine) loadMine(true);                  // 全部送完才同步最新進度，避免覆蓋尚未送出的資料
  } finally { flushing = false; }
}

function confirmIt() {
  const cur = current, it = cur.item, who = $('who').value.trim();
  const job = { regNo: it.登錄號, itemNo: it.物品編號, name: it.財產名稱, who,
    cond: $('cond').value, note: $('note').value.trim(), time: nowStr() };
  queue.push(job); saveQ();
  markDone(it, who, job.time);                 // 畫面立即更新
  renderMine();
  say('✔ ' + esc(it.財產名稱) + ' 盤點完成', 'ok');
  reset(true);
  flush();                                     // 背景送出，不等待
}

window.addEventListener('online', flush);
window.addEventListener('beforeunload', e => {
  if (queue.length) { e.preventDefault(); e.returnValue = ''; }
});

function reset(keepMsg) {
  const fromList = current && current.fromList;
  $('card').style.display = 'none'; current = null;
  if (keepMsg !== true) $('msg').style.display = 'none';
  if (!fromList) startScan();                 // 從清單開啟的，不自動開相機
}

$('start').onclick = startScan;
$('manualGo').onclick = () => { const v = $('manual').value.trim(); if (v) lookup(v); };
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  await stopScan();                           // 檔案辨識需先關閉相機
  try { const code = await getScanner().scanFile(f, false); await lookup(code); }
  catch (err) { say('辨識不到 QR code，請靠近一點再拍', 'warn'); }
  e.target.value = '';
};

renderSync();
loadMine();
if (queue.length) flush();
</script>
</body>
</html>
